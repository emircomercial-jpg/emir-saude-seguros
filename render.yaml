# Blueprint do Render para o backend do EMIR SAUDE SEGUROS.
services:
  - type: web
    name: emir-saude-backend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    preDeployCommand: npx prisma migrate deploy && npx prisma db seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: SWAGGER_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ORGANIZATION_NIF
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: MAX_LOGIN_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: RATE_LIMIT_TTL_SECONDS
        value: "60"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: TIMEZONE
        value: Africa/Luanda
      - key: DEFAULT_LANGUAGE
        value: pt
      - key: DEFAULT_CURRENCY
        value: AOA
      - key: APP_NAME
        value: "EMIR SAUDE SEGUROS"
